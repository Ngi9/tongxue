<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>童学托辅中心 · 教学管理系统</title>
  <!-- Chart.js 成绩可视化图表库 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-color: #5B8C71;
      --primary-hover: #48705A;
      --primary-light: #EBF3EE;
      --bg-color: #F4F7F5;
      --card-bg: #FFFFFF;
      --text-dark: #2C3E35;
      --text-muted: #6B7C73;
      --border-color: #E1E8E3;
      --danger: #E06D53;
      --warning: #E2A03F;
      --success: #52C41A;
      --info: #1890FF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-dark); line-height: 1.5; }

    /* 登录界面 */
    .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--card-bg); width: 100%; max-width: 420px; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border-color); }
    .login-title { font-size: 22px; font-weight: bold; color: var(--primary-color); text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s; }
    .form-control:focus { border-color: var(--primary-color); }
    .btn { display: inline-block; width: 100%; padding: 10px 16px; font-size: 14px; font-weight: 500; text-align: center; border-radius: 6px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--primary-color); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg-color); color: var(--text-dark); border: 1px solid var(--border-color); }
    .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; }
    .btn-danger { background: var(--danger); color: #fff; }

    .quick-login { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border-color); text-align: center; }
    .quick-btn-group { display: flex; gap: 10px; margin-top: 10px; }

    /* 顶栏导航 */
    .header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; sticky: top; top: 0; z-index: 100; }
    .header-brand { font-size: 18px; font-weight: bold; color: var(--primary-color); }
    .semester-tag { background: var(--primary-light); color: var(--primary-color); padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 500; margin-left: 12px; }
    .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }

    /* 主体与侧边栏 */
    .main-wrapper { display: flex; min-height: calc(100vh - 60px); }
    .sidebar { width: 220px; background: var(--card-bg); border-right: 1px solid var(--border-color); padding: 16px 0; }
    .menu-item { padding: 12px 24px; font-size: 14px; color: var(--text-dark); cursor: pointer; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; }
    .menu-item.active { background: var(--primary-light); color: var(--primary-color); border-left-color: var(--primary-color); font-weight: bold; }
    .content-area { flex: 1; padding: 24px; overflow-y: auto; }

    /* 卡片与表格 */
    .card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 20px; margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .card-title { font-size: 16px; font-weight: bold; color: var(--text-dark); }

    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .table th, .table td { padding: 12px; border-bottom: 1px solid var(--border-color); }
    .table th { background: var(--bg-color); font-weight: 600; color: var(--text-muted); }

    /* 状态徽章 */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .badge-success { background: #E6F7ED; color: var(--success); }
    .badge-warning { background: #FDF6EC; color: var(--warning); }
    .badge-danger { background: #FDECE8; color: var(--danger); }
    .badge-info { background: #E6F7FF; color: var(--info); }

    /* SOP卡片 */
    .sop-student-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #fff; }
    .sop-student-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; }
    .job-item { background: var(--bg-color); border-radius: 6px; padding: 12px; margin-bottom: 8px; font-size: 13px; }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .main-wrapper { flex-direction: column; }
      .sidebar { width: 100%; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
      .menu-item { white-space: nowrap; padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // 初始化本地存储数据
    const defaultData = {
      institutionName: "童学托辅中心",
      currentSemester: "2026秋季学期 第7周",
      users: [
        { id: 'u1', email: 'principal@tongxue.com', name: '陈老师', role: 'principal', pass: '123456' },
        { id: 'u2', email: 'zhang@tongxue.com', name: '张老师', role: 'teacher', pass: '123456', classes: ['一年级1班', '二年级1班'] },
        { id: 'u3', email: 'li@tongxue.com', name: '李老师', role: 'teacher', pass: '123456', classes: ['三年级1班'] }
      ],
      students: [
        { id: 's1', name: '张明', class: '一年级1班', gender: '男', teacherId: 'u2', remark: '数学理解力强' },
        { id: 's2', name: '王华', class: '一年级1班', gender: '女', teacherId: 'u2', remark: '需跟进英语朗读' },
        { id: 's3', name: '李强', class: '三年级1班', gender: '男', teacherId: 'u3', remark: '作业认真' }
      ],
      teacherAttendance: { 'u2': '全勤', 'u3': '全勤' },
      studentAttendance: { 's1': '已到课', 's2': '已到课', 's3': '已到课' },
      homework: {
        's1': [{ id: 'h1', subject: '语文', content: '看图写话练习', status: '已完成', wrong: '无', remark: '书写工整' }],
        's2': [{ id: 'h2', subject: '数学', content: '口算卡片20题', status: '完成部分', wrong: '第8题错算', remark: '需订正' }]
      },
      extraTasks: {
        's1': [{ id: 'e1', subject: '英语', content: '单词听写10个', status: '已完成', explain: '已讲解' }]
      },
      feedbacks: {},
      exams: [
        { id: 'ex1', name: '十月月考', class: '一年级1班', subject: '数学', maxScore: 100, scores: { 's1': 95, 's2': 88 } }
      ]
    };

    function loadData() {
      const data = localStorage.getItem('tongxue_data');
      return data ? JSON.parse(data) : defaultData;
    }
    function saveData(data) {
      localStorage.setItem('tongxue_data', JSON.stringify(data));
    }

    let store = loadData();
    let currentUser = JSON.parse(localStorage.getItem('tongxue_user')) || null;
    let currentTab = currentUser ? (currentUser.role === 'principal' ? 'summary' : 'sop1') : 'login';

    function render() {
      const app = document.getElementById('app');
      if (!currentUser) {
        app.innerHTML = renderLogin();
        return;
      }

      app.innerHTML = `
        <header class="header">
          <div style="display:flex;align-items:center;">
            <span class="header-brand">${store.institutionName}</span>
            <span class="semester-tag">${store.currentSemester}</span>
          </div>
          <div class="user-info">
            <span>${currentUser.name} (${currentUser.role === 'principal' ? '校长' : '教师'})</span>
            <button class="btn btn-secondary btn-sm" onclick="logout()">退出</button>
          </div>
        </header>
        <div class="main-wrapper">
          <aside class="sidebar">
            ${renderMenu()}
          </aside>
          <main class="content-area">
            ${renderContent()}
          </main>
        </div>
      `;
    }

    function renderLogin() {
      return `
        <div class="login-container">
          <div class="login-card">
            <div class="login-title">童学托辅中心 · 登录</div>
            <form onsubmit="handleLogin(event)">
              <div class="form-group">
                <label>邮箱账号</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="请输入邮箱" required>
              </div>
              <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPass" class="form-control" placeholder="请输入密码" required>
              </div>
              <button type="submit" class="btn btn-primary">登 录</button>
            </form>
            <div class="quick-login">
              <p style="font-size:12px;color:var(--text-muted);">一键体验快捷登录：</p>
              <div class="quick-btn-group">
                <button class="btn btn-secondary btn-sm" onclick="quickLogin('zhang@tongxue.com')">教师（张老师）</button>
                <button class="btn btn-secondary btn-sm" onclick="quickLogin('principal@tongxue.com')">校长（陈老师）</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMenu() {
      if (currentUser.role === 'principal') {
        return `
          <div class="menu-item ${currentTab==='summary'?'active':''}" onclick="switchTab('summary')">📊 教学汇总中心</div>
          <div class="menu-item ${currentTab==='students'?'active':''}" onclick="switchTab('students')">🎓 学生档案与分配</div>
          <div class="menu-item ${currentTab==='teachers'?'active':''}" onclick="switchTab('teachers')">👩‍🏫 教师管理与考勤</div>
        `;
      } else {
        return `
          <div class="menu-item ${currentTab==='sop1'?'active':''}" onclick="switchTab('sop1')">① 学生考勤 (内部)</div>
          <div class="menu-item ${currentTab==='sop2'?'active':''}" onclick="switchTab('sop2')">② 日常作业派发</div>
          <div class="menu-item ${currentTab==='sop3'?'active':''}" onclick="switchTab('sop3')">③ 辅导检查与附加</div>
          <div class="menu-item ${currentTab==='sop4'?'active':''}" onclick="switchTab('sop4')">④ 家长反馈</div>
          <div class="menu-item ${currentTab==='grades'?'active':''}" onclick="switchTab('grades')">📈 成绩登记与分析</div>
        `;
      }
    }

    function renderContent() {
      if (currentTab === 'summary') return renderSummaryView();
      if (currentTab === 'students') return renderStudentsView();
      if (currentTab === 'teachers') return renderTeachersView();
      if (currentTab === 'sop1') return renderSOP1View();
      if (currentTab === 'sop2') return renderSOP2View();
      if (currentTab === 'sop3') return renderSOP3View();
      if (currentTab === 'sop4') return renderSOP4View();
      if (currentTab === 'grades') return renderGradesView();
      return '';
    }

    /* 校长端 */
    function renderSummaryView() {
      return `
        <div class="card">
          <div class="card-header"><span class="card-title">全校教学实时数据汇总</span></div>
          <div class="grid-3">
            <div style="background:var(--primary-light);padding:16px;border-radius:8px;">
              <div style="font-size:12px;color:var(--text-muted);">学生总人数</div>
              <div style="font-size:24px;font-weight:bold;color:var(--primary-color);">${store.students.length} 人</div>
            </div>
            <div style="background:#E6F7FF;padding:16px;border-radius:8px;">
              <div style="font-size:12px;color:var(--text-muted);">在岗教师</div>
              <div style="font-size:24px;font-weight:bold;color:var(--info);">${store.users.filter(u=>u.role==='teacher').length} 人</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStudentsView() {
      return `
        <div class="card">
          <div class="card-header"><span class="card-title">学生档案与教师分配</span></div>
          <table class="table">
            <thead><tr><th>学生姓名</th><th>班级</th><th>负责教师</th><th>备注</th></tr></thead>
            <tbody>
              ${store.students.map(s => {
                const t = store.users.find(u => u.id === s.teacherId);
                return `<tr>
                  <td><b>${s.name}</b></td>
                  <td>${s.class}</td>
                  <td><span class="badge badge-info">${t ? t.name : '未分配'}</span></td>
                  <td>${s.remark || '-'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderTeachersView() {
      const teachers = store.users.filter(u => u.role === 'teacher');
      return `
        <div class="card">
          <div class="card-header"><span class="card-title">教师管理与每日考勤</span></div>
          <table class="table">
            <thead><tr><th>教师姓名</th><th>负责班级</th><th>邮箱</th><th>今日考勤</th></tr></thead>
            <tbody>
              ${teachers.map(t => `
                <tr>
                  <td><b>${t.name}</b></td>
                  <td>${(t.classes || []).join(', ')}</td>
                  <td>${t.email}</td>
                  <td><span class="badge badge-success">全勤</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    /* 教师端 SOP */
    function renderSOP1View() {
      const myStudents = store.students.filter(s => s.teacherId === currentUser.id);
      return `
        <div class="card">
          <div class="card-header"><span class="card-title">SOP ① 学生考勤 (内部登记)</span></div>
          <div style="display:flex;flex-direction:column;gap:12px;">
            ${myStudents.map(s => `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--border-color);border-radius:6px;">
                <div><b>${s.name}</b> (${s.class})</div>
                <span class="badge badge-success">已到课</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderSOP2View() {
      return `
        <div class="card">
          <div class="card-header"><span class="card-title">SOP ② 日常作业派发</span></div>
          <p style="font-size:14px;color:var(--text-muted);">在此页面可按班级快速进行日常作业派发。</p>
        </div>
      `;
    }

    function renderSOP3View() {
      const myStudents = store.students.filter(s => s.teacherId === currentUser.id);
      return `
        <div class="card">
          <div class="card-header"><span class="card-title">SOP ③ 辅导检查与附加任务</span></div>
          ${myStudents.map(s => {
            const jobs = store.homework[s.id] || [];
            return `
              <div class="sop-student-card">
                <div class="sop-student-header">
                  <span>${s.name} (${s.class})</span>
                </div>
                <div>
                  <p style="font-size:12px;font-weight:bold;margin-bottom:6px;">日常作业：</p>
                  ${jobs.length ? jobs.map(j => `
                    <div class="job-item">
                      <b>[${j.subject}]</b> ${j.content} — 
                      <span class="badge badge-warning">${j.status}</span>
                    </div>
                  `).join('') : '<p style="font-size:12px;color:var(--text-muted);">暂无作业记录</p>'}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderSOP4View() {
      const myStudents = store.students.filter(s => s.teacherId === currentUser.id);
      return `
        <div class="card">
          <div class="card-header"><span class="card-title">SOP ④ 家长反馈卡</span></div>
          ${myStudents.map(s => {
            const shortName = s.name.substring(1); // 自动去姓
            const jobs = store.homework[s.id] || [];
            let feedbackText = `${shortName}妈妈晚上好，这是${shortName}今天的学习情况。\n`;
            jobs.forEach((j, i) => {
              feedbackText += `${j.subject}：${i+1}.${j.content}；（${j.status}·${j.remark || '无'}）\n`;
            });

            return `
              <div class="sop-student-card">
                <div class="sop-student-header">
                  <span>${s.name} 家长反馈预览</span>
                  <button class="btn btn-primary btn-sm" onclick="copyFeedback('${encodeURIComponent(feedbackText)}')">一键复制反馈</button>
                </div>
                <textarea class="form-control" style="height:100px;font-size:13px;" readonly>${feedbackText}</textarea>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderGradesView() {
      return `
        <div class="card">
          <div class="card-header"><span class="card-title">成绩登记与班级分析</span></div>
          <p style="font-size:14px;color:var(--text-muted);">支持中小学全科成绩录入与可视化柱状图对比分析。</p>
        </div>
      `;
    }

    /* 事件与函数 */
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;
      const u = store.users.find(item => item.email === email && item.pass === pass);
      if (u) {
        currentUser = u;
        localStorage.setItem('tongxue_user', JSON.stringify(u));
        currentTab = u.role === 'principal' ? 'summary' : 'sop1';
        render();
      } else {
        alert('账号或密码错误！');
      }
    }

    function quickLogin(email) {
      const u = store.users.find(item => item.email === email);
      if (u) {
        currentUser = u;
        localStorage.setItem('tongxue_user', JSON.stringify(u));
        currentTab = u.role === 'principal' ? 'summary' : 'sop1';
        render();
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('tongxue_user');
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      render();
    }

    function copyFeedback(encodedText) {
      const text = decodeURIComponent(encodedText);
      navigator.clipboard.writeText(text).then(() => {
        alert('已成功复制家长反馈文本！');
      });
    }

    window.onload = render;
  </script>
</body>
</html>
